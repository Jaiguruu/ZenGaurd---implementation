# =============================================================================
# File: logstash/pipeline/logstash.conf
# Project: ZenGuard Zero Trust SIEM - Layer 2 (Normalization Pipeline)
# Description: This pipeline receives raw events from Filebeat agents running
#              on Layer 1 endpoints (Wazuh EDR, Snort IDS, syslog) via the
#              Beats protocol, normalizes all fields into a canonical schema,
#              enriches events with metadata, and routes them into
#              Elasticsearch index patterns for downstream querying by the
#              siem_listener.py and UEBA/SOAR layers.
#
# Field Normalization Goal:
#   Every event — regardless of source — MUST exit this pipeline with:
#     src_ip, dst_ip, user_id, action, event_type, severity, timestamp
#   This canonical schema is what siem_listener.py queries against.
# =============================================================================


# =============================================================================
# INPUT SECTION
# Purpose: Accept log streams from all Filebeat agents running on Layer 1.
#
# Why Beats on 5044?
#   The Lumberjack/Beats protocol is a lightweight, back-pressure-aware
#   binary protocol designed specifically for reliable log shipping. Unlike
#   raw syslog (UDP), Beats guarantees at-least-once delivery with
#   acknowledgment. Port 5044 is the well-known default.
# =============================================================================
input {
  beats {
    # Listen on all interfaces so containerized Logstash accepts connections
    # from external Layer 1 endpoints (not just localhost).
    host => "0.0.0.0"
    port => 5044

    # client_inactivity_timeout: drop connections idle for > 60s to free
    # resources; Filebeat will reconnect automatically.
    client_inactivity_timeout => 60
  }

  # ---------------------------------------------------------------------------
  # TCP INPUT — ZenGuard Replay Engine (zenguard_replayer.py)
  # Accepts raw newline-delimited syslog strings from the dataset replayer.
  # Port 5000 is the Replayer → Logstash channel; Filebeat uses 5044.
  #
  # codec => "line" splits the incoming TCP stream on newlines, yielding one
  # Logstash event per syslog line — exactly what our auth/snort grok parsers
  # expect. Each line is tagged "replayer" so it can be routed separately
  # in the filter section if needed (e.g., to skip certain enrichment steps
  # that only apply to real Filebeat events).
  # ---------------------------------------------------------------------------
  tcp {
    host  => "0.0.0.0"
    port  => 5000
    codec => "json"
    tags  => ["replayer", "synthetic"]
    mode  => "server"
  }
}


# =============================================================================
# FILTER SECTION
# Purpose: Parse, normalize, and enrich every raw log event.
#
# Strategy:
#   1. Identify the event source via Filebeat-injected fields (fields.log_type
#      or [fields][source]).
#   2. Apply source-specific parsing (grok/json/kv).
#   3. Apply universal normalization — map parsed fields to the canonical
#      ZenGuard schema regardless of origin.
#   4. Enrich: geoip for IP fields, user-agent parsing where applicable.
#   5. Sanitize: remove noisy/redundant fields added by Filebeat/Beats.
# =============================================================================
filter {

  # ---------------------------------------------------------------------------
  # REPLAYER BRANCH — ZenGuard Dataset Replay Engine (TCP:5000, JSON codec)
  # This branch fires first, before any Filebeat routing, ensuring synthetic
  # events from zenguard_replayer.py are never routed to the fallback branch.
  # All 7 ML features arrive pre-built in the JSON payload; we read them
  # directly rather than trying to re-derive them from a syslog string.
  # ---------------------------------------------------------------------------
  if "replayer" in [tags] {

    mutate {
      add_field => {
        "log_source" => "replayer"
        "zenguard_source" => "dataset_replay"
      }
    }

    if [event_type] == "snort_alerts" {

      grok {
        match => {
          "message" => "%{MONTHNUM:snort_month}/%{MONTHDAY:snort_day}-%{TIME:snort_time}\.%{INT} \[\*\*\] \[%{INT:gid}:%{INT:snort_sid}:%{INT:snort_rev}\] %{DATA:snort_msg} \[\*\*\] (?:\[Classification: %{DATA:snort_class}\] )?\[Priority: %{INT:snort_priority}\] \{%{WORD:snort_proto}\} %{IP:parsed_src_ip}(?::%{INT:snort_src_port})? -> %{IP:parsed_dst_ip}(?::%{INT:snort_dst_port})?"
        }
        tag_on_failure => ["_grok_replayer_snort_failed"]
      }

    } else {

      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{DATA:auth_result} password for %{DATA:parsed_user} from %{IP:parsed_src_ip} port %{NUMBER:src_port} %{DATA:ssh_protocol}",
            "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{DATA:auth_result} %{DATA:auth_method} for %{DATA:parsed_user} from %{IP:parsed_src_ip} port %{NUMBER:src_port}",
            "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{PROG:program}: %{DATA:parsed_user} : TTY=%{DATA:tty} ; PWD=%{DATA:cwd} ; USER=%{DATA:escalated_to} ; COMMAND=%{GREEDYDATA:sudo_command}",
            "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{GREEDYDATA:raw_message}"
          ]
        }
        tag_on_failure => ["_grok_replayer_auth_failed"]
      }

    }

    if ![src_ip]    { mutate { add_field => { "src_ip"  => "0.0.0.0" } } }
    if ![dst_ip]    { mutate { add_field => { "dst_ip"  => "0.0.0.0" } } }
    if ![user_id]   { mutate { add_field => { "user_id" => "unknown"  } } }
    if ![severity]  { mutate { add_field => { "severity" => "low" } } }
    if ![action]    { mutate { add_field => { "action"   => "replay_event" } } }

    if ![failed_logins]              { mutate { add_field => { "failed_logins"              => "0" } } }
    if ![privilege_change_attempted] { mutate { add_field => { "privilege_change_attempted" => "0" } } }
    if ![external_connection]        { mutate { add_field => { "external_connection"        => "0" } } }
    if ![MFA_bypassed]               { mutate { add_field => { "MFA_bypassed"               => "0" } } }
    if ![session_duration]           { mutate { add_field => { "session_duration"           => "0" } } }
    if ![access_time]                { mutate { add_field => { "access_time"                => "1970-01-01T00:00:00+00:00" } } }
    if ![device_trust_score]         { mutate { add_field => { "device_trust_score"         => "0.5" } } }

    mutate {
      convert => {
        "failed_logins"              => "integer"
        "privilege_change_attempted" => "integer"
        "external_connection"        => "integer"
        "MFA_bypassed"               => "integer"
        "session_duration"           => "float"
        "device_trust_score"         => "float"
      }
    }

  }


  # ---------------------------------------------------------------------------
  # STEP 1 — Route by log source (Filebeat agents only)
  # Filebeat is configured (see filebeat.yml) to add a `fields.log_type` tag
  # to each document identifying its origin. We branch on that value.
  # ---------------------------------------------------------------------------

  # --- LINUX AUTH LOG BRANCH (/var/log/auth.log) ---------------------------
  # Covers: SSH brute-force, sudo escalation, PAM failures, su attempts.
  else if [fields][log_type] == "auth" {

    # grok: parse the standard syslog-format auth line.
    # The named captures become top-level fields in the Logstash event.
    grok {
      match => {
        "message" => [
          # SSH failed password
          "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{DATA:auth_result} password for %{DATA:user_id} from %{IP:src_ip} port %{NUMBER:src_port} %{DATA:ssh_protocol}",

          # SSH accepted password / publickey
          "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{DATA:auth_result} %{DATA:auth_method} for %{DATA:user_id} from %{IP:src_ip} port %{NUMBER:src_port}",

          # sudo escalation
          "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{PROG:program}: %{DATA:user_id} : TTY=%{DATA:tty} ; PWD=%{DATA:cwd} ; USER=%{DATA:escalated_to} ; COMMAND=%{GREEDYDATA:sudo_command}",

          # Generic syslog fallback — captures at minimum timestamp + host
          "%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:host_name} %{GREEDYDATA:raw_message}"
        ]
      }
      tag_on_failure => ["_grok_auth_failed"]
    }

    # --- Normalize auth_result to canonical `action` & `event_type` fields ---
    if [auth_result] =~ /(?i)failed/ {
      mutate {
        add_field => {
          "action"     => "failed_login"
          "event_type" => "failed_logins"
          "severity"   => "medium"
        }
      }
    } else if [auth_result] =~ /(?i)accepted/ {
      mutate {
        add_field => {
          "action"     => "successful_login"
          "event_type" => "auth_success"
          "severity"   => "low"
        }
      }
    } else if [sudo_command] {
      mutate {
        add_field => {
          "action"     => "privilege_escalation"
          "event_type" => "privilege_escalation"
          "severity"   => "high"
        }
      }
    } else {
      mutate {
        add_field => {
          "action"     => "auth_event"
          "event_type" => "auth_generic"
          "severity"   => "low"
        }
      }
    }

    # Set canonical source identifier
    mutate { add_field => { "log_source" => "linux_auth" } }
  }


  # --- SNORT IDS ALERT BRANCH (/var/log/snort/alert) -----------------------
  # Snort "fast" alert format:
  #   MM/DD-HH:MM:SS.usec [**] [gid:sid:rev] Description [**]
  #   [Classification: X] [Priority: N] {PROTOCOL} src_ip:port -> dst_ip:port
  else if [fields][log_type] == "snort" {

    grok {
      match => {
        "message" => "%{MONTHNUM:snort_month}/%{MONTHDAY:snort_day}-%{TIME:snort_time}\.%{INT} \[\*\*\] \[%{INT:gid}:%{INT:snort_sid}:%{INT:snort_rev}\] %{DATA:snort_msg} \[\*\*\] (?:\[Classification: %{DATA:snort_class}\] )?\[Priority: %{INT:snort_priority}\] \{%{WORD:protocol}\} %{IP:src_ip}(?::%{INT:src_port})? -> %{IP:dst_ip}(?::%{INT:dst_port})?"
      }
      tag_on_failure => ["_grok_snort_failed"]
    }

    # Map Snort priority (1=high, 2=medium, 3=low) to canonical severity
    if [snort_priority] == "1" {
      mutate { add_field => { "severity" => "critical" } }
    } else if [snort_priority] == "2" {
      mutate { add_field => { "severity" => "high" } }
    } else {
      mutate { add_field => { "severity" => "medium" } }
    }

    # Snort alerts rarely carry a user_id — set a sentinel value so
    # the canonical schema is always complete.
    mutate {
      add_field => {
        "action"     => "ids_alert"
        "event_type" => "snort_alerts"
        "log_source" => "snort_ids"
        "user_id"    => "N/A"
      }
    }
  }


  # --- WAZUH EDR ALERT BRANCH ----------------------------------------------
  # Wazuh ships JSON-encoded alerts via its own Filebeat module or a custom
  # Filebeat prospector pointed at /var/ossec/logs/alerts/alerts.json.
  else if [fields][log_type] == "wazuh" {

    # Wazuh alerts are pre-formatted JSON. Parse the entire `message` field.
    json {
      source  => "message"
      # If parsing fails (e.g., multiline truncation), tag and continue
      tag_on_failure => ["_json_wazuh_failed"]
    }

    # Wazuh JSON schema → ZenGuard canonical schema mappings
    # We use `rename` rather than `add_field` to avoid duplicating data.
    mutate {
      rename => {
        "[data][srcip]"      => "src_ip"
        "[data][dstip]"      => "dst_ip"
        "[data][dstuser]"    => "user_id"
        "[rule][description]" => "action"
        "[rule][level]"       => "wazuh_rule_level"
      }
      add_field => {
        "event_type" => "wazuh_alert"
        "log_source" => "wazuh_edr"
      }
    }

    # Translate Wazuh rule level (0-15) to canonical severity
    # Levels 12-15 = critical, 9-11 = high, 6-8 = medium, <6 = low
    if [wazuh_rule_level] and [wazuh_rule_level] >= 12 {
      mutate { add_field => { "severity" => "critical" } }
    } else if [wazuh_rule_level] and [wazuh_rule_level] >= 9 {
      mutate { add_field => { "severity" => "high" } }
    } else if [wazuh_rule_level] and [wazuh_rule_level] >= 6 {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
  }


  # --- APPLICATION LOG BRANCH (generic structured JSON) --------------------
  # For custom application logs that already emit structured JSON.
  else if [fields][log_type] == "app" {

    json {
      source        => "message"
      tag_on_failure => ["_json_app_failed"]
    }

    # Apply defaults for any missing canonical fields
    if ![src_ip]     { mutate { add_field => { "src_ip"     => "0.0.0.0" } } }
    if ![dst_ip]     { mutate { add_field => { "dst_ip"     => "0.0.0.0" } } }
    if ![user_id]    { mutate { add_field => { "user_id"    => "unknown"  } } }
    if ![action]     { mutate { add_field => { "action"     => "app_event" } } }
    if ![event_type] { mutate { add_field => { "event_type" => "app_generic" } } }
    if ![severity]   { mutate { add_field => { "severity"   => "low" } } }

    mutate { add_field => { "log_source" => "application" } }
  }


  # --- FALLBACK BRANCH — unknown log type ----------------------------------
  else {
    mutate {
      add_tag  => ["_unknown_log_type"]
      add_field => {
        "src_ip"     => "0.0.0.0"
        "dst_ip"     => "0.0.0.0"
        "user_id"    => "unknown"
        "action"     => "unknown"
        "event_type" => "unknown"
        "severity"   => "low"
        "log_source" => "unknown"
      }
    }
  }


  # ---------------------------------------------------------------------------
  # STEP 2 — Universal Timestamp Normalization
  # All events get a canonical @timestamp in ISO8601 UTC.
  # We prefer the event's own timestamp over Logstash's receipt time to
  # preserve the true order of events (critical for UEBA correlation).
  # ---------------------------------------------------------------------------
  if [syslog_ts] {
    date {
      match    => ["syslog_ts", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target   => "@timestamp"
      timezone => "UTC"
    }
  }

  # Add a human-readable iso8601 string as a separate field for ES scripted
  # fields and Python query convenience
  ruby {
    code => "event.set('timestamp', event.get('@timestamp').to_s)"
  }


  # ---------------------------------------------------------------------------
  # STEP 3 — GeoIP Enrichment
  # Translates raw IP addresses into geographic metadata (country, city,
  # coordinates). This powers Kibana map visualizations and UEBA geo-anomaly
  # detection (e.g., login from a new country).
  # ---------------------------------------------------------------------------
  if [src_ip] and [src_ip] != "0.0.0.0" and [src_ip] != "127.0.0.1" {
    geoip {
      source => "src_ip"
      target => "src_geo"
      # Default GeoLite2-City database is bundled with Logstash.
      # For MaxMind commercial accuracy, mount the .mmdb and set:
      # database => "/usr/share/logstash/GeoLite2-City.mmdb"
    }
  }

  if [dst_ip] and [dst_ip] != "0.0.0.0" and [dst_ip] != "127.0.0.1" {
    geoip {
      source => "src_ip"  # intentionally src; dst is usually internal
      target => "dst_geo"
    }
  }


  # ---------------------------------------------------------------------------
  # STEP 4 — Field sanitization
  # Remove Beats/Filebeat metadata fields that are redundant in Elasticsearch.
  # Keeping them wastes storage and pollutes index mappings.
  # ---------------------------------------------------------------------------
  mutate {
    remove_field => [
      "[beat]", "[prospector]", "[input]", "[log][offset]",
      "[agent][ephemeral_id]", "[ecs][version]",
      "syslog_ts", "auth_result", "auth_method",   # already normalized above
      "snort_month", "snort_day", "snort_time"      # snort ts already in @timestamp
    ]
    # Ensure event_type is always lowercase for consistent ES term queries
    lowercase => ["event_type", "severity", "action"]
  }


  # ---------------------------------------------------------------------------
  # STEP 5 — Brute-force heuristic tagging
  # Add a convenience tag when we detect a rapid sequence of failed logins
  # from the same IP. This is a simple stateless heuristic; the real ML-based
  # brute-force detection lives in the UEBA layer (Layer 3).
  # ---------------------------------------------------------------------------
  # (Full stateful throttle counting requires the aggregate filter plugin or
  #  Redis. This simple version just ensures the field is present for querying.)
  if [event_type] == "failed_logins" {
    mutate { add_tag => ["possible_brute_force"] }
  }

}


# =============================================================================
# OUTPUT SECTION
# Purpose: Route normalized events to the correct Elasticsearch indices.
#
# Index Naming Strategy:
#   zenguard-<log_source>-YYYY.MM.dd
#   Examples:
#     zenguard-linux_auth-2024.01.15
#     zenguard-snort_ids-2024.01.15
#     zenguard-wazuh_edr-2024.01.15
#
#   Why daily indices?
#     - ILM (Index Lifecycle Management) policies roll over daily indices
#       easily, making 30-day retention trivial to enforce.
#     - siem_listener.py can query a wildcard `zenguard-*` to cover all
#       sources, or `zenguard-snort_ids-*` for source-specific analysis.
# =============================================================================
output {

  elasticsearch {
    hosts     => ["http://elasticsearch:9200"]
    user      => "elastic"
    password  => "${ELASTIC_PASSWORD}"

    # Dynamic index name derived from the canonical log_source field
    # + the event date (from the normalized @timestamp, not ingest time)
    index => "zenguard-%{log_source}-%{+YYYY.MM.dd}"

    # document_id: use Filebeat's event.id if available to prevent duplicate
    # documents when Filebeat retransmits after a network hiccup.
    document_id => "%{[@metadata][_id]}"

    # ilm_enabled: tells Logstash to respect Elasticsearch ILM rollover aliases
    # instead of writing to a fixed index name.
    ilm_enabled           => false   # set to true once ILM policy is configured in ES
    ilm_rollover_alias    => "zenguard"
    ilm_policy            => "zenguard-30day-retention"

    # retry_on_conflict: handles the case where two Logstash workers try to
    # update the same document simultaneously.
    retry_on_conflict => 3

    # ssl_certificate_verification: set to true and mount the CA cert when
    # enabling TLS on Elasticsearch in production.
    ssl_certificate_verification => false
  }

  # Debug output — comment out in production to avoid double-writing to stdout
  # and the associated CPU overhead.
  # stdout { codec => rubydebug }
}
